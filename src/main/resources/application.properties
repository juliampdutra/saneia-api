spring.application.name=saneia-api
server.port=8080
api.version=v1

# ===== Banco de dados (valores vêm de variáveis de ambiente) =====
# Local: application-local.properties | Azure: App Settings / Container App env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Swagger / OpenAPI =====
# A rota raiz "/" redireciona para o Swagger UI
springdoc.swagger-ui.path=/
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Erros: nunca expor detalhes internos =====
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# ===== Atrás do proxy do Azure (HTTPS correto no Swagger) =====
server.forward-headers-strategy=framework
